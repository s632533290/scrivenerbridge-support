      "en": {"n":"English","t":"Mobile writing for Scrivener","s":"Continue real .scriv projects on iPhone and iPad.","ol":"Product","ot":"Bring Scrivener projects to mobile","o":"ScrivenerBridge opens real .scriv projects directly, so long-form writing stays clear, organised, and practical on mobile.","f":["Use Ask This Book to explore plots, characters and relationships, get an overview, discuss the story, or ask for writing ideas.","Deep Summary processes the selected, readable text in batches. Follow its progress or stop the task.","Browse Binder structure and edit text, titles, synopses, and chapter status","Read continuously and annotate selected passages","Write changes in place with iCloud sync and automatic pre-write backups","Export RTF, TXT, Markdown, or a complete .scriv project"],"sl":"Support","st":"Need help?","si":"Keep your project intact in the Files app or iCloud Drive before opening it.","q1t":"How do I open a project?","q1":"Choose Import or Open Project in the library, then select a .scriv folder or .scriv.zip file.","q2t":"How does one purchase work across devices?","q2":"One purchase with the same Apple Account unlocks Pro on both iPhone and iPad. Choose Restore Purchase in the paywall if needed.","ct":"Contact support","pl":"Privacy policy","pt":"Your writing belongs to you","pi":"ScrivenerBridge has no accounts, advertising SDKs, or analytics SDKs. It does not upload your writing to developer-operated servers.","pdt":"Data handling","pd":"No app account is required. The app has no advertising or analytics SDKs and does not upload your writing to developer-operated servers. With local models, text retrieval and answer generation run on your device. When you choose an external AI API, confirmed questions and manuscript content are sent directly to your selected provider, whose data handling and charges apply. Apple handles iCloud syncing according to your account settings.","pit":"iCloud","pii":"When a project is stored in iCloud Drive, syncing is handled by Apple’s iCloud service under your account settings.","pct":"Contact us","pc":"Email us with any privacy questions."},

      "fr": {"n":"Français","t":"Écrire avec Scrivener sur mobile","s":"Continuez de vrais projets .scriv sur iPhone et iPad.","ol":"Produit","ot":"Vos projets Scrivener sur mobile","o":"ScrivenerBridge ouvre directement de vrais projets .scriv pour que l’écriture au long cours reste claire et organisée sur mobile.","f":["Interrogez ce livre sur l’intrigue, les personnages et leurs relations. Obtenez une vue d’ensemble, une analyse ou des idées d’écriture.","Le résumé approfondi traite par étapes le texte sélectionné et lisible. Consultez sa progression ou arrêtez la tâche.","Parcourir Binder et modifier le texte, les titres, synopsis et statuts","Lire en continu et annoter les passages sélectionnés","Écrire directement dans le projet, avec iCloud et sauvegardes automatiques","Exporter RTF, TXT, Markdown ou un projet .scriv complet"],"sl":"Assistance","st":"Besoin d’aide ?","si":"Conservez la structure du projet dans Fichiers ou iCloud Drive avant de l’ouvrir.","q1t":"Comment ouvrir un projet ?","q1":"Dans la bibliothèque, choisissez Importer ou Ouvrir un projet, puis un dossier .scriv ou un fichier .scriv.zip.","q2t":"Comment un achat fonctionne-t-il sur plusieurs appareils ?","q2":"Un achat avec le même compte Apple déverrouille Pro sur iPhone et iPad. Utilisez Restaurer les achats au besoin.","ct":"Contacter l’assistance","pl":"Confidentialité","pt":"Votre manuscrit vous appartient","pi":"ScrivenerBridge n’utilise ni compte, ni SDK publicitaire, ni SDK analytique et n’envoie pas vos textes vers des serveurs gérés par le développeur.","pdt":"Traitement des données","pd":"Aucun compte dans l’app n’est requis. L’app ne contient aucun SDK publicitaire ou analytique et n’envoie pas vos textes sur les serveurs du développeur. Avec un modèle local, la recherche et la génération des réponses s’effectuent sur l’appareil. Si vous choisissez une API d’IA externe, les questions et contenus confirmés sont envoyés directement au fournisseur sélectionné, selon ses règles de traitement des données et de facturation. Apple gère la synchronisation iCloud selon les réglages de votre compte.","pit":"iCloud","pii":"Pour un projet dans iCloud Drive, la synchronisation est gérée par le service iCloud d’Apple selon vos réglages.","pct":"Nous contacter","pc":"Écrivez-nous pour toute question de confidentialité。"},
      "es": {"n":"Español","t":"Escritura móvil para Scrivener","s":"Continúa proyectos .scriv reales en iPhone y iPad.","ol":"Producto","ot":"Lleva Scrivener al móvil","o":"ScrivenerBridge abre proyectos .scriv reales directamente para que la escritura extensa siga clara, ordenada y práctica en el móvil.","f":["Pregunta sobre la trama, los personajes y sus relaciones para obtener una visión general, análisis y sugerencias de escritura.","El resumen profundo procesa por lotes el texto seleccionado y legible. Consulta el progreso o detén la tarea.","Explora Binder y edita texto, títulos, sinopsis y estado de capítulos","Lee de forma continua y anota pasajes seleccionados","Escribe cambios en el proyecto con iCloud y copias automáticas","Exporta RTF, TXT, Markdown o un proyecto .scriv completo"],"sl":"Soporte","st":"¿Necesitas ayuda?","si":"Mantén intacta la estructura del proyecto en Archivos o iCloud Drive antes de abrirlo.","q1t":"¿Cómo abro un proyecto?","q1":"En la biblioteca, elige Importar o Abrir proyecto y selecciona una carpeta .scriv o un archivo .scriv.zip.","q2t":"¿Cómo funciona una compra entre dispositivos?","q2":"Una compra con la misma cuenta de Apple desbloquea Pro en iPhone y iPad. Usa Restaurar compra si hace falta.","ct":"Contactar con soporte","pl":"Política de privacidad","pt":"Tu manuscrito es tuyo","pi":"ScrivenerBridge no usa cuentas, SDK de publicidad ni SDK de análisis, y no sube tus textos a servidores operados por el desarrollador.","pdt":"Tratamiento de datos","pd":"No necesitas una cuenta de la app. No contiene SDK de publicidad ni análisis y no envía tus manuscritos a servidores del desarrollador. Los modelos locales buscan el texto y generan respuestas en el dispositivo. Si eliges una API externa, las preguntas y el contenido que confirmas se envían directamente al proveedor seleccionado; se aplican sus reglas de datos y tarifas. Apple gestiona iCloud según la configuración de tu cuenta.","pit":"iCloud","pii":"Para proyectos en iCloud Drive, la sincronización la gestiona el servicio iCloud de Apple según tu cuenta.","pct":"Contacto","pc":"Escríbenos por correo si tienes preguntas sobre privacidad。"},
      "it": {"n":"Italiano","t":"Scrittura mobile per Scrivener","s":"Continua veri progetti .scriv su iPhone e iPad.","ol":"Prodotto","ot":"Scrivener anche su mobile","o":"ScrivenerBridge apre direttamente veri progetti .scriv, per mantenere la scrittura lunga chiara, ordinata e pratica anche su mobile.","f":["Fai domande su trama, personaggi e relazioni per ottenere una panoramica, analisi e spunti di scrittura.","Il riepilogo approfondito elabora in più fasi il testo selezionato e leggibile. Puoi seguirne l’avanzamento o interromperlo.","Esplora Binder e modifica testo, titoli, sinossi e stato dei capitoli","Leggi in continuità e annota passaggi selezionati","Scrivi nel progetto con iCloud e backup automatici","Esporta RTF, TXT, Markdown o un progetto .scriv completo"],"sl":"Supporto","st":"Serve aiuto?","si":"Mantieni intatta la struttura del progetto in File o iCloud Drive prima di aprirlo.","q1t":"Come apro un progetto?","q1":"Nella libreria scegli Importa o Apri progetto, poi seleziona una cartella .scriv o un file .scriv.zip.","q2t":"Come funziona un acquisto su più dispositivi?","q2":"Un acquisto con lo stesso account Apple sblocca Pro su iPhone e iPad. Se necessario scegli Ripristina acquisto.","ct":"Contatta il supporto","pl":"Privacy","pt":"Il tuo manoscritto è tuo","pi":"ScrivenerBridge non usa account, SDK pubblicitari o analitici e non carica i testi su server gestiti dallo sviluppatore.","pdt":"Trattamento dei dati","pd":"Non serve un account dell’app. Non sono presenti SDK pubblicitari o di analisi e i manoscritti non vengono inviati ai server dello sviluppatore. Con i modelli locali, ricerca e generazione avvengono sul dispositivo. Se scegli un’API di IA esterna, domande e testi confermati vengono inviati direttamente al fornitore scelto, secondo le sue regole sui dati e le sue tariffe. Apple gestisce la sincronizzazione iCloud in base alle impostazioni dell’account.","pit":"iCloud","pii":"Per i progetti in iCloud Drive, la sincronizzazione è gestita dal servizio iCloud di Apple secondo le impostazioni del tuo account.","pct":"Contatti","pc":"Scrivici per qualsiasi domanda sulla privacy。"},
      "pt-BR": {"n":"Português","t":"Escrita móvel para Scrivener","s":"Continue projetos .scriv reais no iPhone e iPad.","ol":"Produto","ot":"Leve o Scrivener ao celular","o":"ScrivenerBridge abre projetos .scriv reais diretamente para manter a escrita longa clara, organizada e prática no celular.","f":["Faça perguntas sobre a trama, os personagens e suas relações para obter uma visão geral, análises e sugestões de escrita.","O resumo aprofundado processa em etapas o texto selecionado e legível. Acompanhe o progresso ou interrompa a tarefa.","Navegue pelo Binder e edite texto, títulos, sinopses e status de capítulos","Leia continuamente e faça anotações em trechos selecionados","Grave no projeto com iCloud e backups automáticos","Exporte RTF, TXT, Markdown ou um projeto .scriv completo"],"sl":"Suporte","st":"Precisa de ajuda?","si":"Mantenha a estrutura do projeto intacta no app Arquivos ou no iCloud Drive antes de abri-lo.","q1t":"Como abro um projeto?","q1":"Na biblioteca, escolha Importar ou Abrir projeto e selecione uma pasta .scriv ou um arquivo .scriv.zip.","q2t":"Como uma compra funciona entre dispositivos?","q2":"Uma compra com a mesma Conta Apple desbloqueia o Pro no iPhone e iPad. Use Restaurar compra se necessário.","ct":"Falar com o suporte","pl":"Política de privacidade","pt":"Seu manuscrito é seu","pi":"ScrivenerBridge não usa contas, SDKs de publicidade ou análise e não envia seus textos a servidores operados pelo desenvolvedor.","pdt":"Tratamento de dados","pd":"Não é preciso criar uma conta no app. Ele não contém SDKs de publicidade ou análise e não envia seus manuscritos aos servidores do desenvolvedor. Nos modelos locais, a busca e a geração de respostas ocorrem no dispositivo. Ao escolher uma API de IA externa, perguntas e conteúdo confirmados são enviados diretamente ao provedor selecionado, conforme suas regras de dados e tarifas. A Apple gerencia a sincronização do iCloud de acordo com os ajustes da conta.","pit":"iCloud","pii":"Em projetos no iCloud Drive, a sincronização é processada pelo serviço iCloud da Apple de acordo com sua conta.","pct":"Contato","pc":"Envie um e-mail se tiver dúvidas sobre privacidade。"},
      "ru": {"n":"Русский","t":"Мобильное письмо для Scrivener","s":"Продолжайте настоящие проекты .scriv на iPhone и iPad.","ol":"Продукт","ot":"Scrivener на мобильном устройстве","o":"ScrivenerBridge напрямую открывает настоящие проекты .scriv, сохраняя ясность и порядок в работе над длинными текстами на мобильном устройстве.","f":["Задавайте вопросы о сюжете, героях и их отношениях, получайте обзор, анализ истории и идеи для творчества.","Подробное обобщение поэтапно обрабатывает выбранный текст, доступный для чтения. Следите за ходом работы или остановите задачу.","Просматривайте Binder и редактируйте текст, заголовки, синопсисы и статусы глав","Читайте подряд и добавляйте заметки к выбранным фрагментам","Сохраняйте изменения в проект с iCloud и автоматическими резервными копиями","Экспортируйте RTF, TXT, Markdown или весь проект .scriv"],"sl":"Поддержка","st":"Нужна помощь?","si":"Перед открытием сохраните структуру проекта в «Файлах» или iCloud Drive без изменений.","q1t":"Как открыть проект?","q1":"В библиотеке выберите импорт или открытие проекта, затем папку .scriv либо файл .scriv.zip.","q2t":"Как покупка работает на нескольких устройствах?","q2":"Одна покупка с тем же аккаунтом Apple открывает Pro на iPhone и iPad. При необходимости выберите восстановление покупок.","ct":"Связаться с поддержкой","pl":"Конфиденциальность","pt":"Ваша рукопись принадлежит вам","pi":"ScrivenerBridge не использует аккаунты, рекламные или аналитические SDK и не загружает тексты на серверы разработчика.","pdt":"Обработка данных","pd":"Регистрация в приложении не требуется. Нет рекламных или аналитических SDK; рукописи не отправляются на серверы разработчика. Локальные модели ищут текст и формируют ответы на устройстве. При выборе внешнего API ИИ подтверждённые вопросы и текст отправляются напрямую выбранному провайдеру, по его правилам обработки данных и тарифам. Apple синхронизирует iCloud в соответствии с настройками вашей учётной записи.","pit":"iCloud","pii":"Для проектов в iCloud Drive синхронизация выполняется службой iCloud Apple согласно настройкам аккаунта.","pct":"Связаться с нами","pc":"Напишите нам по электронной почте по вопросам конфиденциальности。"},
      "nl": {"n":"Nederlands","t":"Mobiel schrijven voor Scrivener","s":"Werk verder aan echte .scriv-projecten op iPhone en iPad.","ol":"Product","ot":"Scrivener op mobiel","o":"ScrivenerBridge opent echte .scriv-projecten rechtstreeks, zodat lang schrijven ook mobiel helder, overzichtelijk en praktisch blijft.","f":["Stel vragen over plot, personages en relaties en krijg een overzicht, verhaalanalyse of schrijfideeën.","De uitgebreide samenvatting verwerkt geselecteerde, leesbare tekst in stappen. Volg de voortgang of stop de taak.","Verken Binder en bewerk tekst, titels, samenvattingen en hoofdstukstatus","Lees doorlopend en annoteer geselecteerde passages","Schrijf wijzigingen in het project met iCloud en automatische back-ups","Exporteer RTF, TXT, Markdown of een volledig .scriv-project"],"sl":"Ondersteuning","st":"Hulp nodig?","si":"Behoud de projectstructuur in Bestanden of iCloud Drive voordat je een project opent.","q1t":"Hoe open ik een project?","q1":"Kies in de bibliotheek Importeren of Project openen en selecteer vervolgens een .scriv-map of .scriv.zip-bestand.","q2t":"Hoe werkt één aankoop op meerdere apparaten?","q2":"Eén aankoop met dezelfde Apple-account ontgrendelt Pro op iPhone en iPad. Kies zo nodig Aankoop herstellen.","ct":"Contact opnemen","pl":"Privacybeleid","pt":"Je manuscript is van jou","pi":"ScrivenerBridge gebruikt geen accounts, advertentie-SDK’s of analyse-SDK’s en uploadt je teksten niet naar servers van de ontwikkelaar.","pdt":"Gegevensverwerking","pd":"Je hebt geen appaccount nodig. De app bevat geen advertentie- of analyse-SDK’s en stuurt je teksten niet naar servers van de ontwikkelaar. Bij lokale modellen vinden zoeken en antwoordgeneratie op je apparaat plaats. Kies je een externe AI-API, dan worden bevestigde vragen en teksten rechtstreeks naar de gekozen aanbieder gestuurd; diens regels voor gegevensverwerking en kosten gelden. Apple verwerkt iCloud-synchronisatie volgens je accountinstellingen.","pit":"iCloud","pii":"Voor projecten in iCloud Drive wordt synchronisatie door Apple’s iCloud-service verwerkt volgens je accountinstellingen.","pct":"Contact","pc":"Stuur ons een e-mail met privacyvragen。"},
      "tr": {"n":"Türkçe","t":"Scrivener için mobil yazım","s":"Gerçek .scriv projelerini iPhone ve iPad’de sürdürün.","ol":"Ürün","ot":"Scrivener projelerini mobile taşıyın","o":"ScrivenerBridge gerçek .scriv projelerini doğrudan açar; uzun metin yazımı mobilde de düzenli, açık ve pratik kalır.","f":["Konu, karakterler ve ilişkiler hakkında sorular sorun; genel özet, hikâye analizi ve yazma önerileri alın.","Ayrıntılı özet, seçilen ve okunabilir metni aşamalar halinde işler. İlerlemeyi izleyebilir veya görevi durdurabilirsiniz.","Binder yapısında gezinin; metni, başlıkları, özetleri ve bölüm durumunu düzenleyin","Kesintisiz okuyun ve seçili bölümlere not ekleyin","Değişiklikleri iCloud ve otomatik yedeklemelerle projeye yazın","RTF, TXT, Markdown veya tam .scriv projesini dışa aktarın"],"sl":"Destek","st":"Yardıma mı ihtiyacınız var?","si":"Açmadan önce projenin Dosyalar veya iCloud Drive içindeki yapısını koruyun.","q1t":"Bir projeyi nasıl açarım?","q1":"Kitaplıkta İçe Aktar veya Projeyi Aç seçeneğini belirleyin; ardından .scriv klasörünü ya da .scriv.zip dosyasını seçin.","q2t":"Tek satın alma cihazlar arasında nasıl çalışır?","q2":"Aynı Apple Hesabı ile tek satın alma iPhone ve iPad’de Pro’yu açar. Gerektiğinde Satın Alımı Geri Yükle’yi seçin.","ct":"Destekle iletişim","pl":"Gizlilik politikası","pt":"Taslağınız size aittir","pi":"ScrivenerBridge hesap, reklam SDK’sı veya analiz SDK’sı kullanmaz ve metinlerinizi geliştiricinin sunucularına yüklemez.","pdt":"Veri işleme","pd":"Uygulama hesabı gerekmez. Reklam veya analiz SDK’ları bulunmaz; metinleriniz geliştiricinin sunucularına gönderilmez. Yerel modellerde arama ve yanıt üretimi cihazda yapılır. Harici yapay zekâ API’sini seçerseniz onayladığınız sorular ve metin doğrudan seçtiğiniz sağlayıcıya gönderilir; onun veri işleme kuralları ve ücretleri geçerlidir. iCloud eşzamanlamasını Apple, hesap ayarlarınıza göre yürütür.","pit":"iCloud","pii":"iCloud Drive’daki projelerde eşzamanlama, hesap ayarlarınıza göre Apple’ın iCloud hizmeti tarafından yapılır.","pct":"İletişim","pc":"Gizlilik sorularınız için bize e-posta gönderin。"}

    const group = {"en-US":"en","en-GB":"en","en-CA":"en","en-AU":"en","es-ES":"es","es-MX":"es","zh-Hans":"zh-Hans","zh-Hant":"zh-Hant","ja":"ja","ko":"ko","de-DE":"de","fr-FR":"fr","it":"it","pt-BR":"pt-BR","ru":"ru","nl-NL":"nl","tr":"tr","en":"en","de":"de","fr":"fr","fr-CA":"fr","nl":"nl"};
    const buttons = [['zh-Hans','简体'],['zh-Hant','繁體'],['en-US','EN'],['ja','日本語'],['ko','한국어'],['de-DE','DE'],['fr-FR','FR'],['es-ES','ES'],['it','IT'],['pt-BR','PT'],['ru','RU'],['nl-NL','NL'],['tr','TR']];
    const query = new URLSearchParams(location.search).get('lang'); let locale = group[query] ? query : 'zh-Hans';
    const el = id => document.getElementById(id);
    function render(next) { locale = next; const d = translations[group[locale]]; document.documentElement.lang = locale; document.title = 'ScrivenerBridge · ' + d.t; el('title').textContent=d.t; el('subtitle').textContent=d.s; el('overviewLabel').textContent=d.ol; el('overviewTitle').textContent=d.ot; el('overview').textContent=d.o; el('features').replaceChildren(...d.f.map(x=>Object.assign(document.createElement('li'),{textContent:x}))); el('supportLabel').textContent=d.sl; el('supportTitle').textContent=d.st; el('supportIntro').textContent=d.si; el('faqOneTitle').textContent=d.q1t; el('faqOne').textContent=d.q1; el('faqTwoTitle').textContent=d.q2t; el('faqTwo').textContent=d.q2; el('contactTitle').textContent=d.ct; el('privacyLabel').textContent=d.pl; el('privacyTitle').textContent=d.pt; el('privacyIntro').textContent=d.pi; el('privacyDataTitle').textContent=d.pdt; el('privacyData').textContent=d.pd; el('privacyICloudTitle').textContent=d.pit; el('privacyICloud').textContent=d.pii; el('privacyContactTitle').textContent=d.pct; el('privacyContact').textContent=d.pc; history.replaceState(null,'','?lang='+locale+location.hash); [...el('language').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.locale===locale))); }
    buttons.forEach(([code,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.locale=code;b.onclick=()=>render(code);el('language').append(b);}); render(locale);
